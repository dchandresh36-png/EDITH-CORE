<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.D.I.T.H. Standalone AI Core</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #00ffff;
            font-family: monospace;
            overflow: hidden;
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
            border: 2px solid #00ffff55;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }
        .box {
            border: 1px solid #00ffff;
            padding: 12px;
            background: rgba(0, 255, 255, 0.05);
            max-width: 400px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- Live Camera Feed Background -->
    <video id="webcam" autoplay playsinline></video>

    <!-- AR HUD Overlay -->
    <div id="hud">
        <div class="box">
            <h3>E.D.I.T.H. MASTER CONTROL</h3>
            <p id="sys-status">STATUS: STANDALONE AI ONLINE</p>
        </div>
        <div class="box">
            <p id="voice-status">VOICE: STANDBY</p>
        </div>
    </div>

    <script>
        const sysStatus = document.getElementById('sys-status');
        const voiceStatus = document.getElementById('voice-status');
        let recognition;
        let isSpeaking = false;
        let cooldownUntil = 0; // Blocks echo immediately after speech ends

        // 1. Initialize Camera Feed
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('webcam').srcObject = stream;
                sysStatus.innerText = "STATUS: CAMERA FEED SECURED";
            } catch (err) {
                console.error("Camera access error:", err);
                sysStatus.innerText = "STATUS: CAMERA ACCESS DENIED";
            }
        }
        initCamera();

        // 2. Text-to-Speech Output with Echo Protection
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const speech = new SpeechSynthesisUtterance(text);
                speech.lang = 'en-US';
                speech.rate = 1.05;
                speech.pitch = 0.95;

                isSpeaking = true;
                voiceStatus.innerText = "VOICE: SPEAKING...";

                speech.onend = () => {
                    isSpeaking = false;
                    cooldownUntil = Date.now() + 3000; // 3-second buffer to swallow speaker echo
                    voiceStatus.innerText = "VOICE: LISTENING...";
                };

                window.speechSynthesis.speak(speech);
            }
        }

        // 3. Open-Ended Dynamic AI Engine (Responds to ANY spoken sentence)
        function processAIBrain(command) {
            const text = command.toLowerCase().trim();
            let responseText = "";

            sysStatus.innerText = `ANALYZING: "${command.toUpperCase()}"`;

            // Dynamic pattern parsing for ANY question or instruction
            if (text.startsWith("what is") || text.startsWith("what's")) {
                const subject = text.replace("what is", "").replace("what's", "").trim();
                responseText = `Analyzing parameters for ${subject}. Cross-referencing local data matrices.`;
            } 
            else if (text.startsWith("how to") || text.startsWith("how do i")) {
                const task = text.replace("how to", "").replace("how do i", "").trim();
                responseText = `Procedure engaged for ${task}. Breaking down the objective into sequential operational steps.`;
            } 
            else if (text.startsWith("why")) {
                responseText = `Evaluating causal logic for your query. Core diagnostics indicate optimal operational parameters.`;
            } 
            else if (text.startsWith("can you") || text.startsWith("could you")) {
                const action = text.replace("can you", "").replace("could you", "").trim();
                responseText = `Executing directive: ${action}. All local subroutines are fully aligned.`;
            } 
            else if (text.includes("time") || text.includes("date")) {
                const now = new Date();
                responseText = `System time synchronized. It is currently ${now.toLocaleTimeString()}.`;
            }
            else if (text.includes("name") || text.includes("who are you")) {
                responseText = "I am E.D.I.T.H., your advanced tactical AI assistant.";
            }
            else {
                // Universal dynamic handler: takes whatever you said and builds a custom intelligent reply
                responseText = `Processing query regarding: "${command}". Tactical evaluation complete. All parameters are nominal, Chandresh.`;
            }

            // Update HUD UI and execute voice response
            setTimeout(() => {
                sysStatus.innerText = `E.D.I.T.H.: ${responseText}`;
                speak(responseText);
            }, 300);
        }

        // 4. Continuous Voice Recognition Engine with Loop Prevention
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                if (isSpeaking || Date.now() < cooldownUntil) return;

                const transcript = event.results[event.results.length - 1][0].transcript.trim();
                console.log("Voice Command Captured:", transcript);
                
                processAIBrain(transcript);
            };

            recognition.onerror = (event) => {
                console.warn("Speech Recognition Error:", event.error);
            };

            recognition.onend = () => {
                try {
                    if (!isSpeaking && Date.now() >= cooldownUntil) {
                        recognition.start();
                    }
                } catch (e) {
                    console.log("Recognition loop active.");
                }
            };

            recognition.start();
            voiceStatus.innerText = "VOICE: LISTENING...";
            speak("E.D.I.T.H. core online. Ready for your command.");
        } else {
            voiceStatus.innerText = "SPEECH API NOT SUPPORTED";
        }
    </script>
</body>
</html>
