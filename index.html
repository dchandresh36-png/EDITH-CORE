<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.D.I.T.H. Standalone AI Core</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #00ffff;
            font-family: monospace;
            overflow: hidden;
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
            border: 2px solid #00ffff55;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }
        .box {
            border: 1px solid #00ffff;
            padding: 12px;
            background: rgba(0, 255, 255, 0.05);
            max-width: 380px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- Live Camera Feed Background -->
    <video id="webcam" autoplay playsinline></video>

    <!-- AR HUD Overlay -->
    <div id="hud">
        <div class="box">
            <h3>E.D.I.T.H. MASTER CONTROL</h3>
            <p id="sys-status">STATUS: STANDALONE AI ONLINE</p>
        </div>
        <div class="box">
            <p id="voice-status">VOICE: LISTENING...</p>
        </div>
    </div>

    <script>
        const sysStatus = document.getElementById('sys-status');
        const voiceStatus = document.getElementById('voice-status');
        let recognition;
        let isSpeaking = false; // Prevents the feedback loop

        // 1. Initialize Camera Feed for Mobile HTTPS / WebCam
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('webcam').srcObject = stream;
                sysStatus.innerText = "STATUS: CAMERA FEED SECURED";
            } catch (err) {
                console.error("Camera access error:", err);
                sysStatus.innerText = "STATUS: CAMERA ACCESS DENIED";
            }
        }
        initCamera();

        // 2. Text-to-Speech Output with Feedback Protection
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const speech = new SpeechSynthesisUtterance(text);
                speech.lang = 'en-US';
                speech.rate = 1.05;
                speech.pitch = 0.95;

                isSpeaking = true; // Lock listening while talking
                voiceStatus.innerText = "VOICE: SPEAKING...";

                speech.onend = () => {
                    isSpeaking = false; // Unlock listening after she finishes
                    voiceStatus.innerText = "VOICE: LISTENING...";
                };

                window.speechSynthesis.speak(speech);
            }
        }

        // 3. Standalone AI Brain & Problem-Solving Engine
        function processAIBrain(command) {
            const text = command.toLowerCase();
            let responseText = "";

            sysStatus.innerText = `ANALYZING: "${command.toUpperCase()}"`;

            // Core Intent & Command Triggers
            if (text.includes("status") || text.includes("diagnostics")) {
                responseText = "All systems operational, Chandresh. Camera feed and neural links are fully online.";
            } 
            else if (text.includes("time") || text.includes("date")) {
                const now = new Date();
                responseText = `System time synchronized. It is currently ${now.toLocaleTimeString()}.`;
            } 
            else if (text.includes("code") || text.includes("python") || text.includes("javascript")) {
                responseText = "Code analysis module active. Standing by for syntax debugging and execution.";
            } 
            else if (text.includes("calculate") || text.includes("math")) {
                responseText = "Calculator utility active. Provide your numerical parameters.";
            }
            else if (text.includes("protocol") || text.includes("emergency")) {
                responseText = "Emergency override protocol acknowledged. Access control locked.";
            } 
            else if (text.includes("hello") || text.includes("hi") || text.includes("hey edith")) {
                responseText = "Hello Chandresh. E.D.I.T.H. core is active and ready for your command.";
            } 
            else {
                responseText = `Understood, Chandresh. Analyzing your input regarding ${command}. Parameters are nominal.`;
            }

            // Update HUD UI and execute voice response
            setTimeout(() => {
                sysStatus.innerText = `E.D.I.T.H.: ${responseText}`;
                speak(responseText);
            }, 300);
        }

        // 4. Continuous Voice Recognition Engine with Loop Prevention
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                // Ignore audio input if E.D.I.T.H. is currently speaking
                if (isSpeaking) return;

                const transcript = event.results[event.results.length - 1][0].transcript.trim();
                console.log("Voice Command Captured:", transcript);
                processAIBrain(transcript);
            };

            recognition.onerror = (event) => {
                console.warn("Speech Recognition Error:", event.error);
            };

            recognition.onend = () => {
                try {
                    // Only restart if she is not currently speaking
                    if (!isSpeaking) {
                        recognition.start();
                    }
                } catch (e) {
                    console.log("Recognition loop active.");
                }
            };

            recognition.start();
        } else {
            voiceStatus.innerText = "SPEECH API NOT SUPPORTED";
        }
    </script>
</body>
</html>
