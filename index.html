<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.D.I.T.H. Master Control</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #00ffff;
            font-family: monospace;
            overflow: hidden;
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
            border: 2px solid #00ffff55;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }
        .box {
            border: 1px solid #00ffff;
            padding: 10px;
            background: rgba(0, 255, 255, 0.05);
            max-width: 350px;
        }
    </style>
</head>
<body>

    <!-- Camera Feed Background -->
    <video id="webcam" autoplay playsinline></video>

    <!-- AR HUD Overlay -->
    <div id="hud">
        <div class="box">
            <h3>E.D.I.T.H. AI CORE</h3>
            <p id="sys-status">STATUS: INITIALIZING SYSTEM...</p>
        </div>
        <div class="box">
            <p id="voice-status">VOICE: LISTENING...</p>
        </div>
    </div>

    <script>
        const sysStatus = document.getElementById('sys-status');
        const voiceStatus = document.getElementById('voice-status');

        // 1. Initialize Camera Feed
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('webcam').srcObject = stream;
                sysStatus.innerText = "STATUS: CAMERA ONLINE";
            } catch (err) {
                console.error("Camera access error:", err);
                sysStatus.innerText = "STATUS: CAMERA BLOCKED";
            }
        }
        initCamera();

        // 2. Text-to-Speech Output (E.D.I.T.H.'s Voice)
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const speech = new SpeechSynthesisUtterance(text);
                speech.lang = 'en-US';
                speech.rate = 1.05;
                speech.pitch = 0.95;
                window.speechSynthesis.speak(speech);
            }
        }

        // 3. Native AI Brain & Intent Engine (Runs Locally)
        function processAIBrain(command) {
            const text = command.toLowerCase();
            let responseText = "Command acknowledged, Chandresh.";

            sysStatus.innerText = `ANALYZING: "${command.toUpperCase()}"`;

            // Intent Matching Rules
            if (text.includes("status") || text.includes("diagnostics")) {
                responseText = "All systems operational. Camera feed online. Security protocols nominal.";
            } 
            else if (text.includes("time") || text.includes("date")) {
                const now = new Date();
                responseText = `Current system time is ${now.toLocaleTimeString()}.`;
            } 
            else if (text.includes("code") || text.includes("python") || text.includes("javascript")) {
                responseText = "Neural code parser active. Ready to evaluate syntax algorithms.";
            } 
            else if (text.includes("protocol") || text.includes("emergency")) {
                responseText = "Emergency override protocol acknowledged. Standing by for authorization.";
            } 
            else if (text.includes("hello") || text.includes("hi")) {
                responseText = "Hello Chandresh. E.D.I.T.H. systems are fully online and ready.";
            } 
            else {
                responseText = `Command processed: ${command}. Executing localized routine.`;
            }

            // Update HUD and speak response
            setTimeout(() => {
                sysStatus.innerText = `E.D.I.T.H.: ${responseText}`;
                voiceStatus.innerText = "VOICE: LISTENING...";
                speak(responseText);
            }, 400);
        }

        // 4. Speech Recognition (Your Voice Input)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript.trim();
                console.log("User Command:", transcript);
                processAIBrain(transcript);
            };

            recognition.onerror = (event) => {
                console.warn("Speech Recognition Error:", event.error);
            };

            recognition.onend = () => {
                try {
                    recognition.start();
                } catch (e) {
                    console.log("Recognition restart managed.");
                }
            };

            recognition.start();
        } else {
            voiceStatus.innerText = "VOICE API NOT SUPPORTED";
        }
    </script>
</body>
</html>
