<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.D.I.T.H. True In-Browser AI</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #00ffff;
            font-family: monospace;
            overflow: hidden;
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
            border: 2px solid #00ffff55;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }
        .box {
            border: 1px solid #00ffff;
            padding: 12px;
            background: rgba(0, 255, 255, 0.05);
            max-width: 400px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- Live Camera Feed Background -->
    <video id="webcam" autoplay playsinline></video>

    <!-- AR HUD Overlay -->
    <div id="hud">
        <div class="box">
            <h3>E.D.I.T.H. NEURAL CORE</h3>
            <p id="sys-status">STATUS: LOADING IN-BROWSER LLM...</p>
        </div>
        <div class="box">
            <p id="voice-status">VOICE: STANDBY</p>
        </div>
    </div>

    <!-- Import WebLLM Engine via ESM CDN -->
    <script type="module">
        import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

        const sysStatus = document.getElementById('sys-status');
        const voiceStatus = document.getElementById('voice-status');
        let engine;
        let recognition;
        let isSpeaking = false;
        let cooldownUntil = 0;

        // 1. Initialize Camera Feed
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('webcam').srcObject = stream;
            } catch (err) {
                console.error("Camera access error:", err);
            }
        }
        initCamera();

        // 2. Text-to-Speech Output with Echo Protection
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const speech = new SpeechSynthesisUtterance(text);
                speech.lang = 'en-US';
                speech.rate = 1.05;
                speech.pitch = 0.95;

                isSpeaking = true;
                voiceStatus.innerText = "VOICE: SPEAKING...";

                speech.onend = () => {
                    isSpeaking = false;
                    cooldownUntil = Date.now() + 3000; // 3-second buffer to ignore speaker echo
                    voiceStatus.innerText = "VOICE: LISTENING...";
                };

                window.speechSynthesis.speak(speech);
            }
        }

        // 3. Initialize True In-Browser LLM Brain (Llama 3.2 1B Model)
        async function initLLM() {
            try {
                sysStatus.innerText = "LOADING AI MODEL (PLEASE WAIT)...";
                
                // Creates a local LLM engine running inside your browser via WebGPU
                engine = await CreateMLCEngine("Llama-3.2-1B-Instruct-q4f16_1-MLC", {
                    initProgressCallback: (progress) => {
                        sysStatus.innerText = `LOADING MODEL: ${(progress.progress * 100).toFixed(0)}%`;
                    }
                });

                sysStatus.innerText = "STATUS: LLM NEURAL CORE ONLINE";
                voiceStatus.innerText = "VOICE: LISTENING...";
                speak("E.D.I.T.H. neural core is fully online, Chandresh.");
                
                startVoiceRecognition();
            } catch (err) {
                console.error("LLM Init Error:", err);
                sysStatus.innerText = "ERROR: WEBGPU NOT SUPPORTED";
                speak("Hardware acceleration error.");
            }
        }

        // 4. Process Voice Command through Real LLM
        async function processAIBrain(command) {
            try {
                sysStatus.innerText = `PROCESSING: "${command.toUpperCase()}"`;

                const reply = await engine.chat.completions.create({
                    messages: [
                        { role: "system", content: "You are E.D.I.T.H., an advanced tactical AI assistant created by Tony Stark. Keep your responses concise, sharp, intelligent, and tailored for tech or tactical problem solving." },
                        { role: "user", content: command }
                    ]
                });

                const aiReply = reply.choices[0].message.content.trim();
                sysStatus.innerText = `E.D.I.T.H.: ${aiReply}`;
                speak(aiReply);
            } catch (err) {
                console.error("AI Generation Error:", err);
                sysStatus.innerText = "PROCESSING ERROR";
                speak("Neural computation failed.");
            }
        }

        // 5. Continuous Voice Recognition Engine
        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = false;
                recognition.lang = 'en-US';

                recognition.onresult = (event) => {
                    if (isSpeaking || Date.now() < cooldownUntil) return;

                    const transcript = event.results[event.results.length - 1][0].transcript.trim();
                    console.log("Voice Command Captured:", transcript);
                    processAIBrain(transcript);
                };

                recognition.onerror = (event) => {
                    console.warn("Speech Recognition Error:", event.error);
                };

                recognition.onend = () => {
                    try {
                        if (!isSpeaking && Date.now() >= cooldownUntil) {
                            recognition.start();
                        }
                    } catch (e) {
                        console.log("Recognition loop active.");
                    }
                };

                recognition.start();
            } else {
                voiceStatus.innerText = "SPEECH API NOT SUPPORTED";
            }
        }

        // Boot up the system
        initLLM();
    </script>
</body>
</html>
