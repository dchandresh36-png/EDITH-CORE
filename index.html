<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.D.I.T.H. Advanced Neural Core</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #00ffff;
            font-family: monospace;
            overflow: hidden;
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
            border: 2px solid #00ffff55;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }
        .box {
            border: 1px solid #00ffff;
            padding: 12px;
            background: rgba(0, 255, 255, 0.05);
            max-width: 400px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- Live Camera Feed Background -->
    <video id="webcam" autoplay playsinline></video>

    <!-- AR HUD Overlay -->
    <div id="hud">
        <div class="box">
            <h3>E.D.I.T.H. NEURAL CORE</h3>
            <p id="sys-status">STATUS: INITIALIZING SYSTEM...</p>
        </div>
        <div class="box">
            <p id="voice-status">VOICE: STANDBY</p>
        </div>
    </div>

    <script>
        const sysStatus = document.getElementById('sys-status');
        const voiceStatus = document.getElementById('voice-status');
        let recognition;
        let isSpeaking = false;
        let cooldownUntil = 0; // Blocks echo immediately after speech ends

        // 1. Initialize Camera Feed
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('webcam').srcObject = stream;
                sysStatus.innerText = "STATUS: CAMERA FEED SECURED";
            } catch (err) {
                console.error("Camera access error:", err);
                sysStatus.innerText = "STATUS: CAMERA ACCESS DENIED";
            }
        }
        initCamera();

        // 2. Text-to-Speech Output with Echo Protection
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const speech = new SpeechSynthesisUtterance(text);
                speech.lang = 'en-US';
                speech.rate = 1.05;
                speech.pitch = 0.95;

                isSpeaking = true;
                voiceStatus.innerText = "VOICE: SPEAKING...";

                speech.onend = () => {
                    isSpeaking = false;
                    cooldownUntil = Date.now() + 3000; // 3-second buffer to swallow speaker echo
                    voiceStatus.innerText = "VOICE: LISTENING...";
                };

                window.speechSynthesis.speak(speech);
            }
        }

        // 3. Advanced Local AI Reasoning & Problem-Solving Engine
        function processAIBrain(command) {
            const text = command.toLowerCase();
            let responseText = "";

            sysStatus.innerText = `ANALYZING: "${command.toUpperCase()}"`;

            // A. System Diagnostics & Control
            if (text.includes("status") || text.includes("diagnostics") || text.includes("system")) {
                responseText = "All systems operational, Chandresh. Camera feed and local neural modules are fully online.";
            } 
            // B. Time & Date Intelligence
            else if (text.includes("time") || text.includes("date") || text.includes("clock")) {
                const now = new Date();
                responseText = `System time synchronized. It is currently ${now.toLocaleTimeString()}.`;
            } 
            // C. Coding & Debugging Support
            else if (text.includes("code") || text.includes("python") || text.includes("javascript") || text.includes("debug")) {
                responseText = "Code analysis module active. Send syntax parameters for local evaluation and execution.";
            } 
            // D. Math & Calculation Tool
            else if (text.includes("calculate") || text.includes("math") || text.includes("plus") || text.includes("minus") || text.includes("multiply") || text.includes("divide")) {
                responseText = "Calculator utility active. Processing numerical parameters.";
            }
            // E. Problem Solver Module (Understand -> Break Down -> Solve)
            else if (text.includes("solve") || text.includes("problem") || text.includes("how to")) {
                responseText = `Problem solver engaged. Step one: analyzing your query regarding ${command}. Breaking down parameters for optimal resolution.`;
            }
            // F. Security & Emergency Protocols
            else if (text.includes("protocol") || text.includes("emergency") || text.includes("override")) {
                responseText = "Emergency override protocol acknowledged. Access control locked.";
            } 
            // G. Persona & Identity
            else if (text.includes("who are you") || text.includes("what are you") || text.includes("edith")) {
                responseText = "I am E.D.I.T.H., your advanced tactical AI assistant, created to manage your systems locally.";
            }
            // H. Friendly Greeting
            else if (text.includes("hello") || text.includes("hi") || text.includes("hey")) {
                responseText = "Hello Chandresh. E.D.I.T.H. core is active and ready for your command.";
            } 
            // I. Dynamic Conversational Fallback
            else {
                responseText = `Understood, Chandresh. Evaluating input regarding ${command}. Tactical parameters are nominal.`;
            }

            // Update HUD UI and execute voice response
            setTimeout(() => {
                sysStatus.innerText = `E.D.I.T.H.: ${responseText}`;
                speak(responseText);
            }, 300);
        }

        // 4. Continuous Voice Recognition Engine with Loop Prevention
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                // Ignore if E.D.I.T.H. is speaking or within the 3-second echo cooldown window
                if (isSpeaking || Date.now() < cooldownUntil) return;

                const transcript = event.results[event.results.length - 1][0].transcript.trim();
                console.log("Voice Command Captured:", transcript);
                
                processAIBrain(transcript);
            };

            recognition.onerror = (event) => {
                console.warn("Speech Recognition Error:", event.error);
            };

            recognition.onend = () => {
                try {
                    if (!isSpeaking && Date.now() >= cooldownUntil) {
                        recognition.start();
                    }
                } catch (e) {
                    console.log("Recognition loop active.");
                }
            };

            recognition.start();
            voiceStatus.innerText = "VOICE: LISTENING...";
            speak("E.D.I.T.H. neural core online.");
        } else {
            voiceStatus.innerText = "SPEECH API NOT SUPPORTED";
        }
    </script>
</body>
</html>
